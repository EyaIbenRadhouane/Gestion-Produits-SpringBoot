spring.application.name=gestion-catalogue

server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/cataloguedb?createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=
#JPA :creer et mettre à jour les tables automatiquement
#ddl-auto=update demande à Hibernate d’inspecter vos classes @Entity et de générer au-
#tomatiquement les tables categories et produits correspondantes.
spring.jpa.hibernate.ddl-auto=update 
spring.jpa.show-sql=true